version: 2

models:
  - name: stg_customers_vw
    columns:
      - name: "customer_id"
        tests:
          - unique
          - not_null
      - name: "customer_zip_code_prefix"
        tests:
          - not_null
          - relationships:
              name: customer_zip_code_prefix_relationship
              to: source("t1_bronze", "geolocation")
              field: '"geolocation_zip_code_prefix"'
  - name: stg_orders_vw
    columns:
      - name: "order_id"
        tests:
          - unique
          - not_null
      - name: order_status
        tests:
          - not_null
          - accepted_values:
              values: [
                'created'
                ,'approved'
                ,'invoiced'
                ,'shipped'
                ,'canceled'
                ,'delivered'
                ,'unavailable'
                ,'processing'
              ]
      - name: "customer_id"
        tests:
          - relationships:
              to: ref("stg_customers_vw")
              field: "customer_id"
  - name: stg_order_items_vw
    tests:
      - dbt_utils.unique_combination_of_columns:
          name: composite_key_of_stg_order_items_vw
          combination_of_columns:
            - order_id
            - product_id
    columns:
      - name: "order_id"
        tests:
          - relationships:
              to: ref("stg_orders_vw")
              field: "order_id"
      - name: "product_id"
        tests:
          - relationships:
              to: ref("stg_products_vw")
              field: "product_id"

  - name: stg_order_payments_vw
    tests:
      - dbt_utils.unique_combination_of_columns:
          name: composite_key_of_stg_order_payments_vw 
          combination_of_columns:
            - order_id
            - payment_type
    columns:
      - name: "order_id"
        tests:
          - relationships:
              to: ref("stg_orders_vw")
              field: "order_id"

  - name: stg_products_vw
    columns:
      - name: "product_id"
        tests:
          - unique
          - not_null
      - name: "product_category_name"
        tests:
          - relationships:
              name: product_category_name_relationship
              to: source("t1_bronze", "product_category_name_translation")
              field: '"product_category_name"'

  - name: stg_review_content
    columns:
      - name: "review_id"
        tests:
          - unique
          - not_null
      - name: "review_score"
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4, 5]
  - name: stg_review_order_junction
    tests:
      - dbt_utils.unique_combination_of_columns:
          name: composite_key_of_stg_review_order_junction
          combination_of_columns:
            - review_id
            - order_id
    columns:
      - name: "review_id"
        tests:
          - relationships:
              to: ref("stg_review_content")
              field: review_id
      - name: "order_id"
        tests:
          - relationships:
              to: ref("stg_orders_vw")
              field: "order_id"
  - name: stg_sellers_vw
    columns:
      - name: "seller_id"
        tests:
          - unique
          - not_null
      - name: "seller_zip_code_prefix"
        tests:
          - not_null
          - relationships:
              name: seller_zip_code_prefix_relationship
              to: source("t1_bronze", "geolocation")
              field: '"geolocation_zip_code_prefix"'